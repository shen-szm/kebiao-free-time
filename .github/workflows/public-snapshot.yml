name: Refresh public timetable snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_snapshot.py
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- data/public-snapshot.json; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-snapshot.json
          git commit -m "Refresh public timetable snapshot"
          git push
